apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml
- service.yaml

configMapGenerator:
  - name: cv2xvancoa-blood-donors-webapi-mongodb-init
    files:
      - params/init-db.js
  - name: cv2xvancoa-blood-donors-webapi-config
    literals:
      - database=cv2xvancoa-blood-donors
      - collection=donation_sites
patches:
- path: patches/webapi.deployment.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: cv2xvancoa-blood-donors-webapi